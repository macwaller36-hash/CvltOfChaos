<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800'>
  <style>
    .title { font: bold 28px sans-serif; }
    .h { font: bold 18px sans-serif; }
    .cmd { font: 16px monospace; fill: #111; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
  </style>
  <rect width='100%' height='100%' fill='#0f172a'/>
  <text x='40' y='60' class='title' fill='#ffffff'>TheAsylumBot — Quick Command Cheat Sheet</text>

  <rect x='40' y='90' width='540' height='220' class='box'/>
  <text x='60' y='120' class='h' fill='#0b1220'>User DM Commands</text>
  <text x='60' y='150' class='cmd' fill='#0b1220'>support &lt;message&gt;    — Create ticket (creates thread)</text>
  <text x='60' y='180' class='cmd' fill='#0b1220'>issue &lt;message&gt;      — Report a bug/issue</text>
  <text x='60' y='210' class='cmd' fill='#0b1220'>suggestion &lt;idea&gt;   — File a suggestion</text>
  <text x='60' y='240' class='cmd' fill='#0b1220'>application            — Start staff application</text>
  <text x='60' y='270' class='cmd' fill='#0b1220'>partnership            — Start partnership request</text>

  <rect x='620' y='90' width='540' height='320' class='box'/>
  <text x='640' y='120' class='h' fill='#0b1220'>Staff Server Commands</text>
  <text x='640' y='150' class='cmd' fill='#0b1220'>!reply &lt;user_id&gt; &lt;message&gt;            — DM user via bot</text>
  <text x='640' y='180' class='cmd' fill='#0b1220'>!close &lt;user_id&gt; [reason]                 — Close ticket and log</text>
  <text x='640' y='210' class='cmd' fill='#0b1220'>!accept_partnership &lt;user_id&gt; [note]     — Accept partnership</text>
  <text x='640' y='240' class='cmd' fill='#0b1220'>!reject_partnership &lt;user_id&gt; [reason]   — Reject partnership</text>
  <text x='640' y='270' class='cmd' fill='#0b1220'>!help                                       — Show commands</text>

  <rect x='40' y='330' width='540' height='320' class='box'/>
  <text x='60' y='360' class='h' fill='#0b1220'>Staff DM Commands (DM the bot)</text>
  <text x='60' y='390' class='cmd' fill='#0b1220'>reply &lt;user_id&gt; &lt;message&gt;     — Send DM to user</text>
  <text x='60' y='420' class='cmd' fill='#0b1220'>close &lt;user_id&gt; [reason]         — Close ticket (from DM)</text>
  <text x='60' y='450' class='cmd' fill='#0b1220'>close_no_log &lt;user_id&gt; [reason]  — Close without posting log</text>
  <text x='60' y='480' class='cmd' fill='#0b1220'>cancel_app &lt;user_id&gt;            — Cancel pending application</text>

  <rect x='620' y='420' width='540' height='230' class='box'/>
  <text x='640' y='450' class='h' fill='#0b1220'>Thread Workflow</text>
  <text x='640' y='480' class='cmd' fill='#0b1220'>• Staff message in thread forwards to user (bot sends it)</text>
  <text x='640' y='510' class='cmd' fill='#0b1220'>• Use /embed &lt;text&gt; at start of message to send embed to user</text>
  <text x='640' y='540' class='cmd' fill='#0b1220'>• Attachments in thread are forwarded to user</text>
  <text x='640' y='570' class='cmd' fill='#0b1220'>• Press Accept/Reject buttons on Application/Partnership posts</text>

  <text x='40' y='720' class='cmd' fill='#9aa4b2'>Environment vars: DISCORD_TOKEN, DISCORD_SUPPORT_CHANNEL_ID, DISCORD_STAFF_ROLE_IDS, DISCORD_CLOSE_CHANNEL_ID, DISCORD_CLOSED_CHANNEL_ID, PARTNER_ACCEPT_TEMPLATE, PARTNER_REJECT_TEMPLATE</text>
</svg>